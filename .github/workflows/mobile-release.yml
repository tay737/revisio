name: Mobile release

# Builds the installable artefacts and proves both native clients compile and
# pass their conformance tests. Run by pushing a tag:
#
#   git tag v1.0.0-alpha.2 && git push origin v1.0.0-alpha.2
#
# or by hand from the Actions tab, which builds without publishing a release.
#
# There is NO server URL to configure any more. The apps are native clients
# that speak the backend API directly; the deployment they talk to is compiled
# in (mobile/android/app/build.gradle.kts and the iOS apiBase constant), so
# there is no "not connected" shell to ship by accident.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure the Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "no Android SDK found at $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Stamp the version from package.json
        run: node scripts/native/set-version.mjs

      - name: Test the engine and build the APK
        # `:engine:test` is the gate that matters: it reproduces the canonical
        # TypeScript grading engine's golden vectors with the Kotlin port, so a
        # rule change on the web cannot land here without the native port
        # following it.
        run: |
          cd mobile/android
          ./gradlew :engine:test :app:assembleDebug --no-daemon

      - name: Name the artefact
        run: |
          VERSION="v$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             "Revisio-${VERSION}-android.apk"
          ls -lh Revisio-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Revisio-*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Test the Swift engine
        # Same guarantee as the Kotlin side, against the same vectors.
        run: cd mobile/ios && swift test

      - name: Stamp the version from package.json
        # Writes CFBundleShortVersionString/CFBundleVersion into the app target,
        # so the IPA and the APK cannot disagree about what they are.
        run: node scripts/native/set-version.mjs

      - name: Archive the app
        # There is no distribution certificate in this repo, so the archive is
        # built without signing. `CODE_SIGNING_ALLOWED=NO` is what makes that a
        # supported path rather than a failure: the result is a real device
        # build of the real app target — sources compiled, engine linked,
        # catalog compiled, plist stamped — and it can be re-signed with
        # Sideloadly or AltStore to run on a phone.
        run: |
          cd mobile/ios
          xcodebuild archive \
            -project Revisio.xcodeproj \
            -scheme Revisio-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Revisio.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package the unsigned .ipa
        # An .ipa is only a zip with the app under `Payload/`. Building one by
        # hand is what lets an unsigned build ship; `-exportArchive` would
        # insist on a signing identity we do not have.
        run: |
          VERSION="v$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          APP="$RUNNER_TEMP/Revisio.xcarchive/Products/Applications/Revisio.app"
          test -d "$APP" || { echo "the archive holds no Revisio.app"; exit 1; }
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          ( cd "$RUNNER_TEMP" && zip -qry "Revisio-${VERSION}-ios-unsigned.ipa" Payload )
          mv "$RUNNER_TEMP/Revisio-${VERSION}-ios-unsigned.ipa" .
          ls -lh Revisio-*.ipa

      - name: Check the IPA really is the app we think it is
        # The point of the .ipa is that it is the native client, and something
        # as quiet as an unstamped version or a dropped icon would undermine
        # that. So check the thing we ship rather than the build log.
        run: |
          VERSION="v$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          IPA="Revisio-${VERSION}-ios-unsigned.ipa"
          unzip -p "$IPA" Payload/Revisio.app/Info.plist > "$RUNNER_TEMP/Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Info.plist")
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/Info.plist")
          echo "bundle=$BUNDLE_ID version=$SHORT build=$BUILD"
          test "$BUNDLE_ID" = "app.revisio" || { echo "wrong bundle id: $BUNDLE_ID"; exit 1; }
          test "$SHORT" = "${VERSION#v}" || { echo "version was not stamped: $SHORT"; exit 1; }
          test -n "$BUILD" || { echo "no CFBundleVersion"; exit 1; }
          test -f "$RUNNER_TEMP/Revisio.xcarchive/Products/Applications/Revisio.app/Revisio" \
            || { echo "no executable in the archive"; exit 1; }
          unzip -l "$IPA" | grep -q 'Payload/Revisio.app/AppIcon' \
            || { echo "the compiled icon is missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Revisio-*.ipa
          if-no-files-found: error

  release:
    name: Publish release
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Revisio-*.apk
            Revisio-*.ipa
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Re-tagging a version must replace its artefacts rather than fail on
          # the ones already there, so a fixed build can supersede a broken one.
          overwrite_files: true
          body: |
            ## Revisio ${{ github.ref_name }} — alpha

            Native clients, not a wrapper around the website: the Android app is
            Kotlin + Jetpack Compose over a native engine, and the iOS app is
            Swift + SwiftUI over the same engine ported to Swift. Both are
            **sideload-only alpha artefacts**; neither store is involved yet.

            | Platform | File | Install |
            |---|---|---|
            | Android | `Revisio-${{ github.ref_name }}-android.apk` | Enable "Install unknown apps" and open the file. Debug-signed, so it installs on any device. |
            | iOS | `Revisio-${{ github.ref_name }}-ios-unsigned.ipa` | **Unsigned** — there is no distribution certificate in this repo. Re-sign it with Sideloadly or AltStore to run it on a phone. |

            Both are compiled against **https://revisio-srs.vercel.app**; there is
            no runtime server to configure.

            **Offline review works.** Each app carries today's session on the
            device: it opens to its own screen with no network, grades answers
            with a native port of the server's grading engine (proven identical
            by shared golden vectors), and hands the reviews back when the
            connection returns. `npm run verify:native` drives exactly that on an
            emulator with the network off.

            ### What the iOS artefact is, and is not

            The `.ipa` is a genuine Release device build of the SwiftUI app
            target: the Swift sources are compiled, `RevisioEngine` is linked,
            the icon catalogue is compiled into the bundle and the version is
            stamped from `package.json`. It is **not signed**, so it will not
            install as-is — and it has not been run on hardware here, which is
            stated rather than implied. See `docs/MOBILE.md`.
