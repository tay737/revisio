name: Mobile release

# Builds the installable artefact and proves both native clients compile and
# pass their conformance tests. Run by pushing a tag:
#
#   git tag v1.0.0-alpha.2 && git push origin v1.0.0-alpha.2
#
# or by hand from the Actions tab, which builds without publishing a release.
#
# There is NO server URL to configure any more. The apps are native clients
# that speak the backend API directly; the deployment they talk to is compiled
# in (mobile/android/app/build.gradle.kts and the iOS apiBase constant), so
# there is no "not connected" shell to ship by accident.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure the Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "no Android SDK found at $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Stamp the version from package.json
        run: node scripts/native/set-version.mjs

      - name: Test the engine and build the APK
        # `:engine:test` is the gate that matters: it reproduces the canonical
        # TypeScript grading engine's golden vectors with the Kotlin port, so a
        # rule change on the web cannot land here without the native port
        # following it.
        run: |
          cd mobile/android
          ./gradlew :engine:test :app:assembleDebug --no-daemon

      - name: Name the artefact
        run: |
          VERSION="v$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             "Revisio-${VERSION}-android.apk"
          ls -lh Revisio-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Revisio-*.apk
          if-no-files-found: error

  ios:
    name: iOS client (tests + compile)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Test the Swift engine
        # Same guarantee as the Kotlin side, against the same vectors.
        run: cd mobile/ios && swift test

      - name: Typecheck the SwiftUI app for iOS
        # There is no Xcode app target yet, so this compiles the app sources
        # against the iOS SDK rather than producing an .ipa. It still catches
        # the thing that matters at this stage: whether the surface builds for
        # iOS at all. See docs/MOBILE.md for what remains.
        run: |
          cd mobile/ios
          mkdir -p /tmp/revisio-ios
          xcrun -sdk iphonesimulator swiftc -emit-module \
            -target arm64-apple-ios16.0-simulator -module-name RevisioEngine \
            -emit-module-path /tmp/revisio-ios/RevisioEngine.swiftmodule \
            Sources/RevisioEngine/*.swift
          xcrun -sdk iphonesimulator swiftc -typecheck \
            -target arm64-apple-ios16.0-simulator -I /tmp/revisio-ios \
            -parse-as-library Sources/Revisio/*.swift

  release:
    name: Publish release
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: Revisio-*.apk
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Re-tagging a version must replace its artefacts rather than fail on
          # the ones already there, so a fixed build can supersede a broken one.
          overwrite_files: true
          body: |
            ## Revisio ${{ github.ref_name }} — alpha

            Native clients, not a wrapper around the website: the Android app is
            Kotlin + Jetpack Compose over a native engine, and the iOS client is
            Swift + SwiftUI over the same engine ported to Swift.

            | Platform | Artefact | Notes |
            |---|---|---|
            | Android | `Revisio-${{ github.ref_name }}-android.apk` | Sideload: enable "Install unknown apps" and open the file. Debug-signed, so it installs on any device. |
            | iOS | — | No `.ipa` in this release. The Swift client builds, its engine passes the grading conformance tests, but there is no Xcode app target to archive yet. |

            **Offline review works.** The app carries today's session on the
            device: it opens to its own screen with no network, grades answers
            with a native port of the server's grading engine (proven identical
            by shared golden vectors), and hands the reviews back when the
            connection returns. `npm run verify:native` drives exactly that on
            an emulator with the network off.

            See `docs/MOBILE.md` for the architecture and what remains.
