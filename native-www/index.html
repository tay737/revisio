<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>Revisio</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f5f5f7;
        --muted: #98989d;
        --accent: #1c64f2;
        --surface: #1c1c1e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #000;
        color: var(--ink);
        font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        max-width: 22rem;
      }
      .crest {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: var(--accent);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 38px;
        color: #fff;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 15px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        opacity: 0.8;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        background: var(--surface);
        border-radius: 6px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="crest">R</div>
      <h1 id="title">Revisio</h1>
      <p id="detail">
        This build is not connected to a Revisio server yet. Set
        <code>NATIVE_APP_URL</code> and rebuild to point it at a deployment.
      </p>
      <button id="retry" hidden>Retry</button>
    </main>
    <script>
      // Capacitor reports a failed navigation here. Distinguish the two cases
      // honestly: no URL configured (a build mistake) from a URL that is set but
      // unreachable (a network problem), because the fix is different.
      var configured = (window.Capacitor && window.Capacitor.config &&
        window.Capacitor.config.server && window.Capacitor.config.server.url) || '';
      if (configured) {
        document.getElementById('title').textContent = "Can't reach Revisio";
        document.getElementById('detail').textContent =
          'Check your connection and try again. Your progress is safe on the server.';
        var retry = document.getElementById('retry');
        retry.hidden = false;
        retry.addEventListener('click', function () {
          window.location.replace(configured);
        });
      }
    </script>
  </body>
</html>
